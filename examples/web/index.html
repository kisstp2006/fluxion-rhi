<!doctype html>
<!-- SPDX-License-Identifier: BSD-2-Clause -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluxion RHI - WebGL</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #121216;
    color: #e8e8ea;
    font: 14px system-ui, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #verdict {
    position: fixed;
    left: 24px;
    bottom: 24px;
    padding: 8px 12px;
    border-radius: 6px;
    background: #1d2026;
  }
  #verdict.ok { color: #7ee787; }
  #verdict.bad { color: #ff7b72; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="verdict">starting...</div>
<script type="module">
  // The whole of the JavaScript is fluxion-webgl's glue; this page is only
  // what to load and where to say how the check went.
  import { Fluxion } from "./fluxion-webgl.js";

  const verdict = document.getElementById("verdict");
  try {
    const fluxion = new Fluxion(document.getElementById("canvas"));
    fluxion.resize();

    const app = await fluxion.instantiate("./rhi-web.wasm");
    if (!app.init()) throw new Error("init failed - the console says why");

    const run = app.checks();
    const failed = app.failures();
    // Kept where a test driving the page can read it.
    window.selfCheck = { run, failed, webgl2: fluxion.isWebGL2 };
    verdict.textContent = failed === 0
      ? `self-check: all ${run} passed`
      : `self-check: ${failed} of ${run} wrong - the console says which`;
    verdict.className = failed === 0 ? "ok" : "bad";

    fluxion.run(app.frame);
  } catch (err) {
    window.selfCheck = { error: String(err) };
    verdict.textContent = String(err);
    verdict.className = "bad";
    console.error(err);
  }
</script>
</body>
</html>
